# Project metadata and dependency configuration for uv.

[project]
name = "multimodal_tutor_agentAI"
version = "0.1.0"
description = "A multimodal learning assistant with OpenAI and LangSmith integration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [ 
    "streamlit>=1.40.0",
    "openai>=1.68.0",
    "langsmith>=0.3.0",
    "python-dotenv>=1.0.1",
    "Pillow>=10.0.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    ]

[project.scripts]
multimodal-tutor-agent = "multimodal_tutor_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
 
[tool.uv]
package = false
